<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><link rel="icon" href="data:,"><link rel="stylesheet" href="../css/game.css"><script type="module" src="../js/game.js"></script><title>Jogo da memória</title></head>
<body><main class="container"><header><p class="eyebrow">Estudos interativos</p><h1>Jogo da memória</h1><p class="description">Encontre os 10 pares usando teclado ou toque.</p></header>
<div class="player-actions"><p id="player">Visitante</p><div class="actions"><button id="pause" type="button">Pausar</button><button id="restart" type="button">Reiniciar</button></div></div>
<dl class="scores"><div class="score"><dt>Pares</dt><dd id="pairs">0/10</dd></div><div class="score"><dt>Jogadas</dt><dd id="moves">00</dd></div><div class="score"><dt>Tempo</dt><dd id="time">00:00</dd></div></dl>
<p id="game_status" class="small" role="status" aria-live="polite">Selecione uma carta para começar.</p>
<div id="grid" class="grid" role="group" aria-label="Tabuleiro com vinte cartas"></div>
<p id="keyboard_help" class="small">Tab e Enter selecionam cartas. Pausar interrompe o tempo e oculta as figuras.</p>
<nav class="actions" aria-label="Outros estudos"><a class="button" href="../../catalogue/">Catálogo</a><a class="button" href="../index.html">Trocar apelido</a></nav>
</main></body></html>
