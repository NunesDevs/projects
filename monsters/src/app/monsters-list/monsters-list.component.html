<section class="character-grid" aria-label="Personagens">
@for(character of characters();track character.id){
<article class="character-card" [attr.data-id]="character.id"><div class="monogram" aria-hidden="true">{{character.initials}}</div>
<h2>{{character.name}}</h2><p class="small">{{character.title}}</p>
<dl>@for(attribute of attributes;track attribute[0]){<div class="attribute"><dt>{{attribute[1]}}</dt><dd>{{character.stats[attribute[0]]}}</dd></div>}</dl>
</article>}</section>
